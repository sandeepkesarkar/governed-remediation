# Settings for the scan step (scripts/scan.sh). Sourced by the shell. Names only, no rule text.

# Pinned Semgrep image (same as spikes S3 and S11, see docs/ENVIRONMENT.md).
SEMGREP_IMAGE="semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d"

# The six rule sets, fetched from the Semgrep Registry at run time. No account, no token.
RULESETS="p/javascript p/typescript p/nodejs p/expressjs p/owasp-top-ten p/secrets"

# Paths left out of the scan, relative to the app root.
EXCLUDES="data/static/codefixes/ .github/"

# Where the SARIF goes, inside out/.
OUTPUT_FILE="semgrep.sarif"

# The finding the scan must contain, or the step fails. These are the slice's values.
# Override from the environment: SCAN_EXPECT_FILE and SCAN_EXPECT_CWE.
EXPECT_FILE_DEFAULT="routes/login.ts"
EXPECT_CWE_DEFAULT="CWE-89"
